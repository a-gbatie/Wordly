<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordly</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main>
    <h1>·Wordly·</h1>

    <form id="search-form">
      <label for="word-input">Search for a word</label>

      <input
        type="text"
        id="word-input"
        placeholder="Enter a word"
        aria-label="Word to search"
      >

      <button type="submit">Search</button>
    </form>

    <section id="results" aria-live="polite">
      <!-- results change dynamically, aria-live is useful to assitive tech to let user know the content has changed -->
    </section>

    <p id="error-message" role="alert"></p>
  </main>

  <script src="index.js"></script>
</body>
</html>
